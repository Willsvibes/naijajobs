services:
  backend:
    build:
      context: ./Naija-job-backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./Naija-job-backend/.env
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/naijajobs
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
